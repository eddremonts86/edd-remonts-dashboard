<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Eduardo Inerarte</title>
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Every byte is inline on purpose. This page is served by the service
      worker precisely when the network is gone, so a stylesheet or a font it
      had to fetch would be a blank screen.
    -->
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #0a0a0a;
        color: #f5ede7;
        font:
          300 16px/1.6 ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      main {
        max-width: 30rem;
        text-align: left;
      }
      img {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        display: block;
        margin-bottom: 2.5rem;
      }
      p.kicker {
        margin: 0 0 0.75rem;
        font:
          500 11px/1 ui-monospace,
          SFMono-Regular,
          monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #d13426;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(1.75rem, 6vw, 2.5rem);
        font-weight: 300;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      p.body {
        margin: 0 0 2rem;
        color: rgba(245, 237, 231, 0.72);
      }
      button {
        appearance: none;
        border: 1px solid rgba(245, 237, 231, 0.24);
        background: transparent;
        color: inherit;
        font: inherit;
        padding: 0.7rem 1.4rem;
        border-radius: 999px;
        cursor: pointer;
      }
      button:hover,
      button:focus-visible {
        border-color: rgba(245, 237, 231, 0.6);
      }
      button:focus-visible {
        outline: 2px solid #d13426;
        outline-offset: 3px;
      }
      /* Reduced motion is the default here: there is no motion to reduce. */
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <p class="kicker">No connection</p>
      <h1>This page needs the network.</h1>
      <p class="body">
        Pages you have already opened are still readable from this device. Everything else waits
        until you are back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Reload by itself the moment connectivity returns, so the visitor does
      // not have to notice and press anything.
      addEventListener('online', () => location.reload())
    </script>
  </body>
</html>
