name: auth-local-e2e

# Manual only, deliberately.
#
# This suite has never passed in this repository. It provisions users against a
# `roles` table and a user-role relation that no migration here creates and no
# drizzle schema defines: there are two SQL files and the initial one has no
# such table. Roles in this app live in code, in
# src/modules/users/model/permissions.ts, and `users` has no role column.
#
# The give-away is the database it asks for, `tanstack_template_auth_e2e`: the
# tests came with the template this project was derived from and were never
# adapted. They cannot pass without either re-introducing a data model the app
# does not use, or being rewritten against the one it does.
#
# Blocking every pull request on a job that has failed since May teaches people
# to ignore red, so it no longer runs automatically. It is still here, and still
# runnable from the Actions tab, for whoever decides which of the two it should
# be. The port and .env bugs underneath it are fixed, so it now fails on the
# real problem rather than on ECONNREFUSED.

on:
  workflow_dispatch:

jobs:
  auth-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run auth-local E2E suite
        run: pnpm test:e2e:auth-local

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-auth-local
          path: playwright-report
          if-no-files-found: ignore
