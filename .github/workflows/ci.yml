name: ci

# The repository had exactly one workflow, auth-local-e2e, and it had been red
# since May because it targeted a schema that never existed here. Removing it
# left no automated checks at all, so this replaces it with the ones that
# actually guard this codebase.
#
# The build step is not ceremony. A missing NODE_ENV once produced a bundle
# compiled in development mode and run in production mode, which answered 500
# on every route; scripts/verify/production-bundle.sh fails the build rather
# than shipping that again.
#
# The unit suite was held out of this workflow while 8 of its tests failed. It
# is back in as of 2026-08-10, green at 152/152, and it stays in: a suite that
# does not gate anything stops being maintained, which is how those 8 rotted in
# the first place.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: types, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint --quiet

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      - name: Confirm no dev bundle reached dist
        run: pnpm verify:build

