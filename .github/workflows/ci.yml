name: ci

# The repository had exactly one workflow, auth-local-e2e, and it had been red
# since May because it targeted a schema that never existed here. Removing it
# left no automated checks at all, so this replaces it with the four that
# actually guard this codebase.
#
# The build step is not ceremony. A missing NODE_ENV once produced a bundle
# compiled in development mode and run in production mode, which answered 500
# on every route; verify-production-bundle.sh fails the build rather than
# shipping that again.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: types, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint --quiet

      - name: Build
        run: pnpm build

      - name: Confirm no dev bundle reached dist
        run: pnpm verify:build

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Expected red on arrival: 8 of 184 fail, in the dashboard DataTable, the
      # RAG context builder and config loading. They predate this workflow and
      # are unrelated to the landing. The job exists so that number is visible
      # and goes down, rather than being discovered by whoever next runs the
      # suite locally.
      - name: Unit and integration tests
        run: pnpm test:unit
