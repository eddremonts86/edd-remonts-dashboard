name: ci

# The repository had exactly one workflow, auth-local-e2e, and it had been red
# since May because it targeted a schema that never existed here. Removing it
# left no automated checks at all, so this replaces it with the four that
# actually guard this codebase.
#
# The build step is not ceremony. A missing NODE_ENV once produced a bundle
# compiled in development mode and run in production mode, which answered 500
# on every route; scripts/verify/production-bundle.sh fails the build rather
# than shipping that again.
#
# `pnpm test:unit` is deliberately NOT here, and that is a gap, not an
# oversight. 8 of 184 tests fail as of 2026-08-10 — in the dashboard DataTable,
# the RAG context builder and config loading — and they were already failing
# before this workflow existed. Running them would make every pull request red
# for reasons unrelated to the change under review, which is how the previous
# workflow ended up ignored for three months.
#
# Run them locally with `pnpm test:unit`. Add the job back the moment the count
# reaches zero; until then this file should not imply the suite is green.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: types, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint --quiet

      - name: Build
        run: pnpm build

      - name: Confirm no dev bundle reached dist
        run: pnpm verify:build

